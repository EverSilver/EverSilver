name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter eversilver-app compile

      - run: pnpm --filter eversilver-app exec vitest run --config test/vitest.config.ts --no-coverage
        env:
          CI: '1'

  rust:
    name: Rust check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libappindicator3-dev librsvg2-dev \
            cmake ninja-build clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check workspace
        run: cargo check --workspace --all-targets
        env:
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

  billing-worker:
    name: Billing worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/billing-worker
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install
      - run: npm test

  build-windows:
    name: Windows release build (smoke)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM
        run: choco install llvm -y
        shell: powershell

      - name: Install vendored tauri-cli
        run: cargo install --path app/src-tauri/vendor/tauri-cef/crates/tauri-cli --locked
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

      - run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm --filter eversilver-app win:build:release
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: eversilver-windows-installer
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
