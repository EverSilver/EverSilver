[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eversilver-llm-backend"
version = "0.1.0"
description = "OpenAI-compatible LLM proxy for Eversilver, backed by LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eversilver" }]
license = { text = "GPL-3.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "litellm>=1.83",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[project.scripts]
eversilver-llm-backend = "app.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]
